name: Release

# Pushing a tag such as v26.10.29 builds the release APK signed with this fork's key
# and publishes it as a GitHub Release. Running the workflow by hand builds the same
# APK as an artifact only. Pushes to ci/ branches check the release build.
on:
  push:
    tags: ['v*']
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PACKAGE: com.faqxd.moonlight
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # All history: the version code is the number of commits
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      # Releases and builds by hand need the release key; the ci/ branch check may do without
      - name: Build the signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          REQUIRE_RELEASE_KEY: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'yes' || '' }}
        run: |
          # Tag v26.10.29 is version 26.10.29; counting commits keeps version codes increasing
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="$(git describe --tags --always | sed 's/^v//')"
          fi
          version_code="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          bash .github/build-signed.sh -PreleaseVersionName="$version_name" -PreleaseVersionCode="$version_code" \
            :app:assembleNonRootRelease

      # This fork's app at this version, signed with the key above, with the embedded Tailscale
      - name: Check the APK
        run: |
          apk=$(ls app/build/outputs/apk/nonRoot/release/*.apk)
          bash .github/check-apk.sh "$apk"
          grep -qF "name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" badging.txt
          mkdir -p dist
          cp "$apk" "dist/moonlight-$VERSION_NAME.apk"

      # The notes list the commits since the last release. update.json, which the app's update
      # check reads, carries them with this version and the earlier ones.
      - name: Write the release notes and update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commits after tag $1 (or the last few when there is none) up to $2
          notes_for() {
            if [ -n "$1" ]; then
              git log --no-merges --format='- %s' "$1..$2"
            else
              git log --no-merges --format='- %s' --max-count=15 "$2"
            fi
          }
          repo="https://github.com/$GITHUB_REPOSITORY"
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          notes_for "$prev" HEAD > dist/notes.md
          history='[]'
          if [ -n "$prev" ]; then
            if gh release download "$prev" --pattern update.json --output prev.json 2>/dev/null; then
              history=$(jq -c '[.data.latest] + (.data.history // [])' prev.json)
            else
              # A release from before update.json existed
              before=$(git describe --tags --abbrev=0 --match 'v*' "$prev^" 2>/dev/null || true)
              history=$(jq -nc --argjson code "$(git rev-list --count "$prev")" --arg name "${prev#v}" \
                --arg desc "$(notes_for "$before" "$prev")" --arg github "$repo/releases/tag/$prev" \
                '[{code: $code, versionName: $name, desc: $desc, github: $github}]')
            fi
          fi
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --rawfile desc dist/notes.md \
            --arg github "$repo/releases/tag/$GITHUB_REF_NAME" --argjson history "$history" \
            '{data: {latest: {code: $code, versionName: $name, desc: $desc, github: $github}, history: $history[:30]}}' \
            > dist/update.json
          cat dist/notes.md dist/update.json

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "dist/moonlight-$VERSION_NAME.apk" dist/update.json
          --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: moonlight-release-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error
