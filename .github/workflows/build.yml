name: Build APK

on:
  # Branches only: release tags are built by release.yml
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      # Without a stable key every build has a new signature and can't be installed over the last one
      - name: Restore the CI signing key
        uses: actions/cache@v6
        with:
          path: ~/ci-debug.keystore
          key: ci-debug-keystore

      # "android" is the standard debug keystore password, not a secret
      - name: Create the CI signing key on first use
        run: |
          [ -f ~/ci-debug.keystore ] || keytool -genkeypair -keystore ~/ci-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: >
          ./gradlew --no-daemon -PincludeKishiHaptics=false -PincludeStereo3dAi=false
          -Pandroid.injected.signing.store.file=$HOME/ci-debug.keystore
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android
          :app:assembleNonRootDebug

      # Fails the build if Gradle silently left the embedded Tailscale out
      - name: Check the APK contains the Tailscale bindings
        run: |
          apk=$(ls app/build/outputs/apk/nonRoot/debug/*.apk)
          ls -l "$apk" app/libs-tailnet/tailnet.aar
          unzip -l "$apk" | grep 'lib/arm64-v8a/libgojni.so'
          # The signing fingerprint should stay the same from build to build
          keytool -printcert -jarfile "$apk" | grep -m1 "SHA256:" || true

      - uses: actions/upload-artifact@v7
        with:
          name: moonlight-nonRoot-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error

      # The resolved module versions, to pin by committing them
      - uses: actions/upload-artifact@v7
        with:
          name: tailnet-go-modules
          path: |
            tailnet/go.mod
            tailnet/go.sum
