name: Build APK

on:
  # Branches only: release tags are built by release.yml
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      # Signed with this fork's release key like the releases, so each debug build installs over the last
      - name: Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: bash .github/build-signed.sh :app:assembleNonRootDebug

      - name: Check the APK
        run: bash .github/check-apk.sh app/build/outputs/apk/nonRoot/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: moonlight-nonRoot-debug
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
