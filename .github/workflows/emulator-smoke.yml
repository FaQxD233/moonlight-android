name: Emulator smoke test

# Starts the app with built-in Tailscale enabled on an emulator and prints what happened.
on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # arm64 for phones and x86_64 for the emulator
      - uses: ./.github/actions/prepare
        with:
          tailnet-targets: android/arm64,android/amd64

      - name: Build APK
        run: ./gradlew --no-daemon -PincludeKishiHaptics=false -PincludeStereo3dAi=false :app:assembleNonRootDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash .github/emulator-smoke.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-logcat
          path: logcat*.txt
